name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify annotated V1 zero-power authority tag
        shell: bash
        run: |
          tag=refs/tags/V1_VALID_ZERO_POWER_BASELINE
          test "$(git --no-replace-objects cat-file -t "$tag")" = "tag"
          target="$(git --no-replace-objects rev-parse "${tag}^{commit}")"
          test "$target" = "bf3b3331b623afbdaed295919b3ac945c10692f6"
          test "$(git --no-replace-objects cat-file -t "$target")" = "commit"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .github/drand-verifier/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: .github/drand-verifier
      - name: Verify historical Quicknet fixture offline
        working-directory: .github/drand-verifier
        run: |
          node verify_historical_fixture.mjs historical_quicknet_round_1.json valid
          node verify_historical_fixture.mjs historical_quicknet_round_1.json tampered
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install -e .
      - name: Verify historical Focus 1 authority and the declared PR B delta
        shell: bash
        run: |
          test "$(git --no-replace-objects cat-file -t refs/tags/ragwarrant-focus1-freeze-v1-c771afc)" = "tag"
          test "$(git --no-replace-objects rev-parse refs/tags/ragwarrant-focus1-freeze-v1-c771afc^{commit})" = "124836bcc2fba48373d7bd08f0087b23f2e41620"
          python - <<'PY'
          from pathlib import Path
          from ragwarrant.research.packaging_portability_amendment import (
              HISTORICAL_FOCUS1_AUTHORITY_VERIFIED,
              PR_B_DECLARED_COMPATIBILITY_DELTA_VERIFIED,
              verify_historical_focus1_authority,
              verify_pr_b_declared_compatibility_delta,
          )
          historical = verify_historical_focus1_authority(Path.cwd())
          delta = verify_pr_b_declared_compatibility_delta(Path.cwd())
          assert historical["status"] == HISTORICAL_FOCUS1_AUTHORITY_VERIFIED
          assert delta["status"] == PR_B_DECLARED_COMPATIBILITY_DELTA_VERIFIED
          assert delta["complete_historical_byte_equivalence_claimed"] is False
          PY
      - name: Reverify the qualified PR A scientific scope
        shell: bash
        run: |
          pr_a_root="$RUNNER_TEMP/pr-a-scientific-scope"
          git worktree add --detach "$pr_a_root" 3039150a36045f2aaa1636d94ce988ed8c62e166
          (cd "$pr_a_root" && PYTHONPATH="$pr_a_root/src" python -m pytest -q tests/research/test_pr_a_review_scope.py)
          git worktree remove --force "$pr_a_root"
      - run: python -m compileall src scripts
      - run: python scripts/validate_publication_bundle.py
      - run: python -m pytest -q tests/publication tests/research
      - name: Verify protected historical paths remain unchanged
        run: git diff --exit-code ca7a8fa08500d821dc21163d1b5fca17ab919bd7 HEAD -- README.md artifacts results
