name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .github/drand-verifier/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: .github/drand-verifier
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install -e .
      - run: python scripts/validate_publication_bundle.py
      - run: pytest -q tests/publication tests/research
