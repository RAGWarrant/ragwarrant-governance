name: Publication Check

on:
  push:
  pull_request:

jobs:
  publication-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_publication_bundle.py
      - run: python scripts/validate_brand_consistency.py
