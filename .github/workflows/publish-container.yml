name: Publish Container

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

env:
  IMAGE_NAME: ghcr.io/ragwarrant/ragwarrant-governance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build input hash
        id: input_hash
        run: echo "value=$(python3 scripts/compute_container_build_input_hash.py)" >> "$GITHUB_OUTPUT"

      - name: Build and publish multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/RAGWarrant/ragwarrant-governance
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign digest with keyless identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Verify published manifest platforms
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}" > manifest-inspect.txt
          grep -q "linux/amd64" manifest-inspect.txt
          grep -q "linux/arm64" manifest-inspect.txt

      - name: Record digest file
        run: |
          python3 scripts/record_image_digest.py \
            --digest "${{ steps.build.outputs.digest }}" \
            --candidate-tag "${{ github.sha }}" \
            --source-commit "${{ github.sha }}" \
            --build-input-sha256 "${{ steps.input_hash.outputs.value }}" \
            --output deploy/IMAGE_DIGEST

      - name: Upload digest record
        uses: actions/upload-artifact@v4
        with:
          name: ragwarrant-image-digest
          path: |
            deploy/IMAGE_DIGEST
            manifest-inspect.txt

      - name: Open digest-record pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="digest-record/${GITHUB_RUN_ID}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            base="main"
          else
            base="${GITHUB_REF_NAME}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add deploy/IMAGE_DIGEST
          git diff --cached --quiet && exit 0
          git commit -m "Record published RAGWarrant image digest"
          git push -u origin "$branch"
          gh pr create \
            --base "$base" \
            --head "$branch" \
            --title "Record published RAGWarrant image digest" \
            --body "Records the GHCR multi-architecture image digest produced by workflow run ${GITHUB_RUN_ID}. A human should review this PR before merge."
