suite: ragwarrant_confirmatory_provenance_v2
suite_version: 2
seed: 20260806

provenance:
  mode: strict_git
  require_git_head: true
  require_clean_working_tree: true
  confirmatory_without_git_allowed: false
  require_docker_digest: false
  run_operator: codex

generators:
  regimes:
    - deterministic_grounded_extractive
    - local_open_weight_or_hosted_pinned_optional

baselines:
  required:
    - static_default_rag_policy
    - best_single_policy_on_validation
    - uniform_random_search
    - greedy_coordinate_search
    - greedy_regression_aware_search
    - optuna_tpe
    - ragwarrant_no_fork
    - governed_selection
    - quality_only_selection

budget:
  primary_mode: normalized_cost
  parity_tolerance: 0.01

hypotheses:
  governance_noninferiority_margin: 0.01
  nofork_secondary_noninferiority_margin: 0.01

statistics:
  confidence_level: 0.95
  bootstrap_samples: 5000

certificate:
  supported_enabled: false
  max_class: Candidate external signal
