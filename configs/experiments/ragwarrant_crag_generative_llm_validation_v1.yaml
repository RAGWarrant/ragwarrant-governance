suite: ragwarrant_crag_generative_llm_validation_v1
suite_version: 1
seed: 20260810

dataset:
  source: crag
  require_noncommercial_research_approval: true
  export_raw_question_text: false
  export_raw_evidence_text: false
  export_raw_api_response: false

sample:
  development_rows: 20
  validation_rows: 40
  confirmatory_rows: 40
  max_total_rows: 100

generator:
  provider_env: RAGWARRANT_GENERATOR_PROVIDER
  model_env: RAGWARRANT_GENERATOR_MODEL
  prompt_text_exported: false
  raw_generated_answer_exported: false

quality:
  metric_config: configs/experiments/ragwarrant_generated_answer_quality_v1.yaml
  generated_quality_noninferiority_margin: 0.01
  block_constant_zero_signal: true

selector:
  primary_endpoint_env: RAGWARRANT_CRAG_GEN_PRIMARY_ENDPOINT
  latency_guardrail_env: RAGWARRANT_CRAG_GEN_LATENCY_GUARDRAIL
  quality_risk_guardrail_policy: quality_guarded_latency_adaptive_expansion
  quality_risk_guardrail_rule: start with two evidence items and expand to five when local CRAG answer/alternate-answer containment is absent
  learned_quality_risk_guardrail_policy: learned_quality_risk_latency_adaptive_expansion
  learned_quality_risk_guardrail_rule: learn a deployable expansion rule from validation generated-quality loss and rerun only if it reduces expansions while preserving validation noninferiority
  learned_quality_risk_allowed_features:
    - domain
    - question_type
    - static_or_dynamic
    - result_count
    - low_context_item_count
    - low_context_token_count
    - low_context_char_count
    - expanded_context_token_count
    - expanded_context_char_count
    - low_title_hash_diversity
  learned_quality_risk_disallowed_features:
    - raw_question_text
    - raw_answer_text
    - raw_source_text
    - raw_api_response
    - generated_answer_text
  export_raw_guardrail_text: false

output:
  sanitize_raw_text: true
  append_only: true
