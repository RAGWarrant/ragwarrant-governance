suite: ragwarrant_end_to_end_public_confirmatory_v2
suite_version: 2
seed: 20260806
evidence_mode: end_to_end_public_rag_confirmatory

provenance:
  require_git_head: true
  require_clean_working_tree: true
  require_docker_digest: false
  allow_dirty_confirmatory: false
  run_operator: codex

dataset:
  minimum_total_queries: 150
  confirmatory_test_must_be_uninspected: true

baselines:
  required:
    - static_default_rag_policy
    - best_single_policy_on_validation
    - uniform_random_search
    - greedy_coordinate_search
    - greedy_regression_aware_search
    - optuna_tpe
    - ragwarrant_no_fork

budget:
  primary_mode: normalized_cost
  parity_tolerance: 0.01
  deployment_horizons:
    - 1000
    - 10000
    - 100000

hypotheses:
  superiority_margin: 0.0
  practical_superiority_margin: 0.01
  noninferiority_margin: 0.01
  raw_quality_noninferiority_margin: 0.01
  protected_regression_margin: 0.03

statistics:
  confidence_level: 0.95
  bootstrap_samples: 5000
  grouped_bootstrap: true
  category_balanced_analysis: true

certificate:
  supported_enabled: false
  max_class: Candidate external signal
