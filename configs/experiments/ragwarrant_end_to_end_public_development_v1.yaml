suite: ragwarrant_end_to_end_public_development_v1
suite_version: 1
profile: development
evidence_mode: end_to_end_public_rag_development
seed: 20260806

dataset:
  dataset_dir: <approved-data-root>/source-validation-workspace/artifacts/datasets/ragwarrant_public_corpus_acquisition_v1_20260806_PENDING
  require_acquisition_approved: true
  require_corpus_backed_eligible: true
  require_revision_pin: true
  require_raw_hashes: true
  require_normalized_hashes: true

policy_space:
  chunk_size: [256, 512, 1024]
  chunk_overlap: [0, 64, 128]
  retriever_type: [sparse]
  top_k: [1, 2, 3, 4, 5]
  reranker_enabled: [false, true]
  citation_required: [false, true]
  abstention_threshold: [0.2, 0.5, 0.8]
  generator_type: [extractive_grounded]

baselines:
  required:
    - static_default_rag_policy
    - best_single_policy_on_validation
    - uniform_random_search
    - greedy_coordinate_search
    - greedy_regression_aware_search
    - optuna_tpe
    - ragwarrant_no_fork

budget:
  primary_mode: normalized_cost
  parity_tolerance: 0.01
  deployment_horizons: [1000, 10000, 100000]

primary_endpoint:
  metric: query_operational_utility
  primary_baseline_rule: best_eligible_non_ragwarrant_on_validation
  superiority_margin: 0.01
  utility_noninferiority_margin: -0.01
  raw_quality_noninferiority_margin: -0.01
  protected_regression_margin: -0.03

certificate:
  supported_enabled: false
  max_class: Inconclusive

output:
  append_only: true
  validate_schemas: true
  preserve_per_query_outputs: true

