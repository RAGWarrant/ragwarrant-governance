suite: ragwarrant_end_to_end_public_v1
suite_version: 1
profile: confirmatory
evidence_mode: end_to_end_public_rag
seed: 12345

dataset:
  name: public_corpus_backed_rag_dataset_placeholder
  acquisition_required: true

dataset_capability:
  has_corpus: false
  has_queries: false
  has_reference_answers: false
  has_supporting_documents: false
  redistribution_permitted: unknown
  end_to_end_eligible: false

policy_space:
  chunk_size: [256, 512]
  chunk_overlap: [0, 64]
  retriever_type: [sparse, dense, hybrid]
  top_k: [3, 5, 8]
  query_rewrite_enabled: [false, true]
  reranker_enabled: [false, true]
  reranker_depth: [10, 20]
  context_compression_enabled: [false, true]
  citation_required: [true]
  abstention_threshold: [0.3, 0.5, 0.7]
  generator_model: [adapter_configured]
  answer_length_policy: [short, medium]

objectives:
  primary: cost_adjusted_utility
  cost_weight: 0.25
  latency_weight: 0.10
  protected_regression_threshold: -0.03

baselines:
  - static_default_rag_policy
  - best_single_policy_on_validation
  - uniform_random_search
  - greedy_regression_aware_search
  - optuna_tpe
  - ragwarrant_no_fork

certificate:
  supported_enabled: false
  max_class: Candidate external signal

output:
  append_only: true
  validate_schemas: true
  write_markdown_report: true
