suite: ragwarrant_fresh_live_crag_mock_api_behavioral_governance_v1
suite_version: 1
seed: 20260810
dataset:
  source: crag
  require_noncommercial_research_approval: true
  require_mock_api_server: true
  export_raw_query_text: false
  export_raw_api_response: false
  export_raw_source_documents: false
splits:
  calibration_fraction: 0.50
  validation_fraction: 0.25
  confirmatory_fraction: 0.25
  stratify_by:
    - domain
    - question_type
    - static_or_dynamic
quality:
  metric: proxy_plus_evidence_plus_available_correctness
  quality_noninferiority_margin: 0.01
  require_evidence_support_component: true
cost_latency:
  use_measured_api_calls: true
  use_measured_latency: true
  use_context_token_estimates: true
policies:
  required:
    - low_retrieval_single_endpoint
    - expanded_retrieval_multi_endpoint
    - adaptive_routing_on_insufficient_evidence
    - measured_cost_minimizer_at_quality_floor
    - measured_latency_minimizer_at_quality_floor
    - quality_only_best_on_validation
    - constrained_quality_optimizer
    - pareto_frontier_selector
    - governed_selection
    - static_default_policy
output:
  append_only: true
  sanitize_raw_text: true
  validate_schemas: true
