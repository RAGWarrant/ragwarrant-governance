suite: ragwarrant_governance_ablation_v1
seed: 12345
dataset:
  name: fixture_governance
  path: data/fixtures/governance_fixture.jsonl
  split: {train: 0.6, validation: 0.2, test: 0.2}
  protected_subset_field: protected_group
policy_space:
  top_k: [3, 5, 8]
  reranker_enabled: [false, true]
  citation_required: [false, true]
  abstention_threshold: [0.2, 0.5, 0.8]
objectives:
  primary: cost_adjusted_utility
  raw_quality_weight: 1.0
  cost_weight: 0.25
  latency_weight: 0.1
  protected_regression_threshold: -0.03
baselines:
  - static_default_rag_policy
  - best_single_policy_on_validation
  - uniform_random_search
  - greedy_coordinate_search
  - greedy_regression_aware_search
  - optuna_tpe_optional
  - bayesian_optimization_optional
  - successive_halving_or_asha_optional
  - retrieval_confidence_gating
  - uncertainty_threshold_gating
  - entropy_margin_gating
  - ragwarrant_no_fork
  - ragwarrant_adaptive_compute_optional
  - ragwarrant_full_optional
certificate:
  min_effect_size: 0.02
  bootstrap_samples: 200
  confidence_level: 0.95
  refuse_if_utility_fragile: true
  refuse_if_protected_regression: true
output:
  append_only: true
  write_markdown_report: true

