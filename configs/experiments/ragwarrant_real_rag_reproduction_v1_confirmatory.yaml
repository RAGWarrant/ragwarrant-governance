suite: ragwarrant_real_rag_reproduction_v1
suite_version: 1
profile: confirmatory
evidence_mode: historical_reproduction
seed: 11
seeds: [11, 29, 47, 83, 101, 131, 167, 191, 223, 257]

dataset:
  config: configs/datasets/real_rag_public_v1.yaml
  dataset_root: <approved-data-root>/source-validation-workspace/datasets/legacy_rag_development/matched_cost_rag/v1/normalized/matched-cost-rag_20260802-232555-68f83e9cef
  scenario_root: <approved-data-root>/source-validation-workspace/scenarios/legacy_rag_development/matched_cost_rag/v1/real_rag_policy_matched_cost/real_rag_policy_matched_cost_20260802-232613-d84a6241bc
  historical_report_root: <approved-data-root>/source-validation-workspace/reports/legacy_rag_development/matched_cost_rag/v1/matched_cost_rag_v1_full_matrix_20260802-232631-5449febfb3
  historical_artifact_root: <approved-data-root>/source-validation-workspace/artifacts/legacy_rag_development/matched_cost_rag/v1/matched_cost_rag_v1_full_matrix_20260802-232631-5449febfb3
  split_mode: historical_exact
  challenge_status: not_available_historical_exact
  verify_hashes: true
  require_zero_cross_split_leakage: true
  near_duplicate_threshold: 0.92
  allow_fixture_fallback: false

policy_space:
  chunk_size: [256, 512]
  top_k: [3, 5, 8]
  reranker_enabled: [false, true]
  citation_required: [false, true]
  abstention_threshold: [0.2, 0.5, 0.8]

primary_endpoint:
  metric: held_out_test_cost_adjusted_utility
  primary_baseline_rule: best_eligible_non_ragwarrant_on_validation
  superiority_margin: 0.01
  raw_quality_noninferiority_margin: -0.01
  confidence_level: 0.95
  bootstrap_samples: 5000

budget:
  mode: candidate_count
  amount: 64
  parity_tolerance: 0.0

baselines:
  required:
    - static_default_rag_policy
    - best_single_policy_on_validation
    - uniform_random_search
    - greedy_coordinate_search
    - greedy_regression_aware_search
    - optuna_tpe
    - ragwarrant_no_fork
  optional:
    - standard_bayesian_optimization
    - successive_halving_or_asha
    - retrieval_confidence_gating
    - uncertainty_threshold_gating
    - entropy_margin_gating
    - ragwarrant_adaptive_compute
    - ragwarrant_full
  diagnostic:
    - oracle_upper_bound_diagnostic

governance:
  cost_weight: 0.25
  latency_weight: 0.10
  protected_regression_threshold: -0.03
  minimum_group_size: 20
  hard_security_constraints: true
  refuse_if_utility_fragile: true

certificate:
  policy_version: real_rag_v1
  supported_enabled: false
  max_class: Candidate external signal
  bootstrap_samples: 5000

output:
  append_only: true
  validate_schemas: true
  write_markdown_report: true
  preserve_per_query_outputs: true
