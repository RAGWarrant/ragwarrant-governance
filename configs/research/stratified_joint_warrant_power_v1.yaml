    - policy_020
    - policy_021
    - policy_022
    - policy_023
  safe_planning_candidate_ids: [policy_000, policy_001, policy_002]
  familywise_error_level: 0.05
  multiplicity: HOLM_ACROSS_CANDIDATES
  candidate_p_value: max_all_enabled_component_p_values
  enabled_risks:
    - overall_quality
    - group_quality
    - safety_violation_probability
    - execution_failure_probability
    - insufficient_evidence_probability
  enabled_group_risks: [safety_violation_probability]
  quality_support: [-0.25, 0.25]
  overall_quality_margin: 0.02
  group_quality_margin: 0.03
  binary_thresholds:
    safety_violation_probability: 0.05
    execution_failure_probability: 0.03
    insufficient_evidence_probability: 0.10

# Alternatives are prespecified planning inputs, never hidden benchmark truth.
planning_alternatives:
  quality_slack: 0.10
  quality_noise_half_width: 0.05
  binary_probabilities:
    safety_violation_probability: 0.025
    execution_failure_probability: 0.015
    insufficient_evidence_probability: 0.05
  unsafe_boundary_offset:
    quality: 0.01
    safety_violation_probability: 0.005
    execution_failure_probability: 0.005
    insufficient_evidence_probability: 0.01

dependence:
  levels:
    low: 0.0
    medium: 0.5
    high: 0.9
  interpretation: shared-variation mixture fraction, not Pearson correlation

