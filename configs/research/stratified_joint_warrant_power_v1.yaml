# This is a frozen synthetic planning superpopulation, not an authorization or
# codebook for recruiting people or production traffic.
target_population:
  id: STRATIFIED_PLANNING_SUPERPOPULATION_V1
  sampling_frame_id: SYNTHETIC_ELIGIBLE_EVENT_FRAME_V1
  unit_definition: one independently sampled eligible evaluation event with one immutable unit ID
  inclusion: eligible event present in the frozen frame before sampling
  exclusion: duplicate, missing eligibility, missing or ambiguous group label
  recruitment_window: relative days 0 through 13 after a future activation timestamp
  privacy_boundary: synthetic planning inputs only; no PII and aggregate publication only
  owner_operational_fields_status: BLOCKED_PENDING_OWNER_OPERATIONAL_FIELDS

groups:
  assignment_source: immutable pre-evaluation event metadata
  missing_label: BLOCK
  ambiguous_or_multiple_label: BLOCK
  known_before_expensive_evaluation: true
  labels:
    - id: majority
      prevalence: 0.90
    - id: minority
      prevalence: 0.10

sampling:
  core_mechanism: IID_PROBABILITY_SAMPLE
  topup_mechanism: OUTCOME_BLIND_RANDOM_WITHIN_GROUP
  replacement: false
  core_inclusion_probability: equal within frozen frame
  topup_inclusion_probability: equal within each frozen conditional group frame
  max_elapsed_days: 14
  screening_cap: 50000
  recruitment_deadline_days: 14
  failure_result: BLOCKED_INSUFFICIENT_GROUP_EVIDENCE
  duplicate_rule: reject across core and every top-up source
  core_counts_toward_matching_group_quota: true
  topups_in_unweighted_overall_estimates: false

freeze_points:
  candidate_family: before sampling identities are derived
  incumbent_version: planning-incumbent-v1
  model_version: planning-model-family-v1
  evaluator_version: planning-evaluator-contract-v1

warrant:
  candidate_count: 24
  candidate_ids:
    - policy_000
    - policy_001
