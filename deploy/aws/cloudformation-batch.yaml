AWSTemplateFormatVersion: "2010-09-09"
Description: Example RAGWarrant AWS Batch job definition
Parameters:
  ContainerImage:
    Type: String
    Default: RAGWARRANT_IMAGE_REFERENCE_PLACEHOLDER
Resources:
  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: ragwarrant-governance-batch
      Type: container
      PlatformCapabilities:
        - FARGATE
      ContainerProperties:
        Image: !Ref ContainerImage
        Command:
          - run-governance-job
          - --config
          - /inputs/public_mini_governance_job.yaml
          - --output-root
          - /outputs
          - --decision-out
          - /outputs/promotion_decision.json
        ResourceRequirements:
          - Type: VCPU
            Value: "1"
          - Type: MEMORY
            Value: "2048"
        Environment:
          - Name: RAGWARRANT_STORAGE_MODE
            Value: local
          - Name: RAGWARRANT_INPUT_DIR
            Value: /inputs
          - Name: RAGWARRANT_OUTPUT_DIR
            Value: /outputs
        ReadonlyRootFilesystem: true
