AWSTemplateFormatVersion: "2010-09-09"
Description: Example RAGWarrant ECS Fargate task definition
Parameters:
  ContainerImage:
    Type: String
    Default: RAGWARRANT_IMAGE_REFERENCE_PLACEHOLDER
Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: ragwarrant-governance-task
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: "1024"
      Memory: "2048"
      ContainerDefinitions:
        - Name: ragwarrant
          Image: !Ref ContainerImage
          Command:
            - run-governance-job
            - --config
            - /inputs/public_mini_governance_job.yaml
            - --output-root
            - /outputs
            - --decision-out
            - /outputs/promotion_decision.json
          Environment:
            - Name: RAGWARRANT_STORAGE_MODE
              Value: local
            - Name: RAGWARRANT_INPUT_DIR
              Value: /inputs
            - Name: RAGWARRANT_OUTPUT_DIR
              Value: /outputs
          ReadonlyRootFilesystem: true
