name: Example AWS ECS Or Batch
on:
  workflow_dispatch:
jobs:
  validate-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: docker build -t ragwarrant-governance:ci .
      - name: Run publication check
        run: docker run --rm ragwarrant-governance:ci validate-bundle
