name: Example Azure Container Apps Job
on:
  workflow_dispatch:
jobs:
  run-ragwarrant-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: docker build -t ragwarrant-governance:ci .
      - name: Validate bundle in container
        run: docker run --rm ragwarrant-governance:ci validate-bundle
