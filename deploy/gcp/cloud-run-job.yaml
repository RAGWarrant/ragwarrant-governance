apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ragwarrant-governance-job
spec:
  template:
    spec:
      template:
        spec:
          containers:
            - image: RAGWARRANT_IMAGE_REFERENCE_PLACEHOLDER
              args:
                - run-governance-job
                - --config
                - /inputs/public_mini_governance_job.yaml
                - --output-root
                - /outputs
                - --decision-out
                - /outputs/promotion_decision.json
              env:
                - name: RAGWARRANT_STORAGE_MODE
                  value: local
                - name: RAGWARRANT_INPUT_DIR
                  value: /inputs
                - name: RAGWARRANT_OUTPUT_DIR
                  value: /outputs
          maxRetries: 0
