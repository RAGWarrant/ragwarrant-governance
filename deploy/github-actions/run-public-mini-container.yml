name: Run Public Mini Container
on:
  workflow_dispatch:
jobs:
  public-mini:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ragwarrant-governance:ci .
      - name: Run governance job
        run: docker run --rm ragwarrant-governance:ci run-governance-job --config configs/jobs/public_mini_governance_job.yaml --output-root /tmp/ragwarrant-outputs --decision-out /tmp/ragwarrant-outputs/promotion_decision.json
