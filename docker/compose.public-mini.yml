services:
  ragwarrant-public-mini:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ragwarrant:local
    command:
      - run-governance-job
      - --config
      - configs/jobs/public_mini_governance_job.yaml
      - --output-root
      - /outputs
      - --decision-out
      - /outputs/promotion_decision.json
    environment:
      RAGWARRANT_CONTAINER: "1"
      RAGWARRANT_STORAGE_MODE: local
      RAGWARRANT_OUTPUT_ROOT: /outputs
    volumes:
      - ../docker_outputs:/outputs
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
