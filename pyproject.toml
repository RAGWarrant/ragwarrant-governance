[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragwarrant-governance"
version = "0.1.0"
description = "Scientific-review bundle for the RAGWarrant governance validation harness."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
s3 = [
  "boto3==1.35.99",
]
azure = [
  "azure-storage-blob==12.24.0",
]
gcs = [
  "google-cloud-storage==2.19.0",
]
storage-emulators = [
  "boto3==1.35.99",
  "azure-storage-blob==12.24.0",
  "google-cloud-storage==2.19.0",
]

[project.scripts]
ragwarrant = "ragwarrant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/publication"]
markers = [
  "storage_emulator: integration tests that require Docker-backed object-storage emulators",
  "workspace_materialization: read-only integrity tests requiring an explicitly supplied local confirmation materialization root",
]
